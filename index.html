<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🔥 소방기술사 50문제 · 10분 샘플</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #181a20;
      --muted: #6b7280;
      --primary: #dc2626;
      --primary-soft: #fef2f2;
      --accent: #2563eb;
      --ok: #16a34a;
      --ok-bg: #f0fdf4;
      --bad: #dc2626;
      --bad-bg: #fef2f2;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 48px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 10px;
    }
    .topbar-inner {
      max-width: 680px;
      margin: 0 auto;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
    }
    .timer {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 18px;
      padding: 6px 12px;
      border-radius: 10px;
      background: #111827;
      color: #ffffff;
      min-width: 82px;
      text-align: center;
      transition: background 0.2s;
    }
    .timer.warn { background: #d97706; }
    .timer.danger { background: #dc2626; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }

    .tabs {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .tab-btn {
      flex: 1;
      border: 1px solid var(--border);
      background: #f9fafb;
      color: #374151;
      padding: 8px 6px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    .container {
      max-width: 680px;
      margin: 16px auto 0;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(17, 24, 39, 0.03);
    }
    .intro-card {
      text-align: center;
      padding: 28px 20px;
    }
    .intro-card h1 { margin: 0 0 8px; font-size: 22px; }
    .intro-card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .meta-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .meta-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #374151;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s, opacity 0.15s;
      width: 100%;
    }
    .btn:active { transform: scale(0.99); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-dark { background: #111827; color: #fff; }
    .btn-outline { background: #fff; color: #111827; border: 1px solid var(--border); }
    .btn-sm { padding: 7px 10px; font-size: 12px; border-radius: 8px; width: auto; }

    .q-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .q-num { font-size: 13px; font-weight: 800; color: var(--primary); }
    .q-ref {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      background: #f3f4f6;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .q-text { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
    .prev-wrong {
      font-size: 12px;
      color: #b91c1c;
      background: #fef2f2;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 10px;
    }
    .blank-input {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      outline: none;
    }
    .blank-input:focus { border-color: var(--accent); }
    .options { display: flex; flex-direction: column; gap: 8px; }
    .opt-label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      background: #fff;
    }
    .opt-label input { accent-color: var(--primary); width: 17px; height: 17px; }
    .opt-label.selected { border-color: var(--primary); background: var(--primary-soft); }

    .card.correct { border-color: #86efac; background: var(--ok-bg); }
    .card.wrong { border-color: #fca5a5; background: var(--bad-bg); }
    .explain {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed rgba(0,0,0,0.12);
      font-size: 13px;
      color: #374151;
      display: none;
    }
    .explain.show { display: block; }
    .result-box {
      display: none;
      text-align: center;
      border: 2px solid #111827;
    }
    .result-box.show { display: block; }
    .score-big { font-size: 34px; font-weight: 900; margin: 6px 0; }
    .hidden { display: none; }
    .btn-row { display: flex; gap: 8px; margin-top: 14px; }

    .history-wrap {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      text-align: left;
    }
    .history-title {
      font-size: 14px;
      font-weight: 800;
      margin: 0 0 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-stats {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-radius: 10px;
      background: #f9fafb;
      border: 1px solid var(--border);
      font-size: 13px;
    }
    .history-score { font-weight: 800; color: #111827; }
    .empty-state {
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row">
        <div class="brand">
          <span>🚒 소방기술사 50문제</span>
          <span class="badge" id="roundBadge">50문제 샘플 · 10분</span>
        </div>
        <div class="timer" id="timer">10:00</div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tabToday" onclick="switchTab('today')">🔥 오늘 시험</button>
        <button class="tab-btn" id="tabReview" onclick="switchTab('review')">📌 틀린 문제 (<span id="wrongCountBadge">0</span>)</button>
        <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">📊 한 달 기록</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 1. 오늘 시험 탭 -->
    <section id="viewToday">
      <section class="card intro-card" id="introSection">
        <h1>🔥 소방기술사 50문제 · 10분 샘플</h1>
        <p>화재안전성능기준(NFPC)·화재안전기술기준(NFTC) 전 범위 핵심 50문제입니다.<br/>시작 버튼을 누르면 <strong>10분 타이머</strong>가 바로 작동합니다.</p>
        <div class="meta-row">
          <span class="meta-pill">⏱ 제한시간 10분</span>
          <span class="meta-pill">📝 빈칸 + 객관식 50문항</span>
          <span class="meta-pill">💾 오답·한 달 점수 자동 저장</span>
        </div>
        <button class="btn btn-primary" id="startBtn">10분 시험 시작하기</button>
      </section>

      <section class="card result-box" id="resultBox">
        <div id="resultTitle" style="font-weight:800; font-size:15px;">채점 결과</div>
        <div class="score-big" id="scoreText">0 / 20점</div>
        <div id="timeSpentText" style="color:var(--muted); font-size:13px;"></div>
        <div id="wrongSavedNote" style="color:#b91c1c; font-size:12px; font-weight:600; margin-top:4px;"></div>
        <div class="btn-row">
          <button class="btn btn-dark" id="copyBtn">📋 결과 복사해서 인증하기</button>
          <button class="btn btn-outline" id="retryBtn">🔄 다시 풀기</button>
        </div>
        <div class="history-wrap" id="resultHistoryWrap"></div>
      </section>

      <section id="quizSection" class="hidden">
        <div id="questionsWrap"></div>
        <button class="btn btn-primary" id="submitBtn">제출하고 채점하기</button>
      </section>
    </section>

    <!-- 2. 틀린 문제 복습 탭 -->
    <section id="viewReview" class="hidden">
      <div class="card">
        <div class="q-head" style="margin-bottom:4px;">
          <span style="font-weight:800; font-size:16px;">📌 틀린 문제 오답 복습</span>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-outline btn-sm" onclick="clearSolvedReview()">맞힌 문제 비우기</button>
            <button class="btn btn-primary btn-sm" onclick="gradeReview()">복습 채점하기</button>
          </div>
        </div>
        <div style="font-size:13px; color:var(--muted);">어제와 그동안 틀린 문제가 날짜가 지나도 그대로 남아요. 다시 풀어서 맞힌 뒤 정리해 보세요!</div>
      </div>
      <div id="reviewWrap"></div>
    </section>

    <!-- 3. 한 달 점수 기록 탭 -->
    <section id="viewHistory" class="hidden">
      <div class="card" id="historyFullCard"></div>
    </section>
  </main>

  <script>
    const QUIZ_DATE = "2026-11-27 샘플 50문제";
    const TOTAL_SECONDS = 600;
    const HISTORY_KEY = "fire_quiz_history_v1";
    const WRONG_KEY = "fire_quiz_wrong_v1";
    const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

    const QUESTIONS = [
      {
        id: 1,
        ref: "NFTC 101 · 대형소화기 정의",
        type: "blank",
        prompt: "대형소화기는 화재 시 사람이 운반할 수 있도록 운반대와 바퀴가 설치되어 있고, 능력단위가 A급 (   )단위 이상, B급 20단위 이상인 소화기를 말한다. (숫자만 입력)",
        answers: ["10"],
        explain: "정답: 10단위 (대형소화기는 A급 10단위 이상·B급 20단위 이상, 소형소화기는 능력단위 1단위 이상이면서 대형소화기 미만입니다.) NFTC 101 1.7.1.2"
      },
      {
        id: 2,
        ref: "NFTC 101 · 소화기 배치",
        type: "choice",
        prompt: "소화기는 각 층마다 설치하는 외에, 각 층이 2 이상의 거실로 구획된 경우 바닥면적이 얼마 이상으로 구획된 각 거실에도 배치해야 하는가?",
        choices: ["33 ㎡", "50 ㎡", "100 ㎡", "200 ㎡"],
        answerIndex: 0,
        explain: "정답: 33 ㎡ 이상으로 구획된 각 거실 (층마다 설치 + 33 ㎡ 이상 거실마다 배치입니다.) NFTC 101 2.1.1.4.1"
      },
      {
        id: 3,
        ref: "NFTC 101 · 간이소화용구 한도",
        type: "choice",
        prompt: "능력단위가 2단위 이상이 되도록 소화기를 설치해야 할 특정소방대상물에서, 소화기를 간이소화용구로 대체할 때 간이소화용구의 능력단위는 전체 능력단위의 얼마를 초과할 수 없는가?",
        choices: ["3분의 1", "2분의 1", "3분의 2", "제한 없음"],
        answerIndex: 1,
        explain: "정답: 2분의 1 (다만 노유자시설은 이 제한을 받지 않습니다.) NFTC 101 2.1.1.5"
      },
      {
        id: 4,
        ref: "NFTC 102 · 호스 구경",
        type: "choice",
        prompt: "옥내소화전설비의 호스 구경 기준으로 옳은 것은? (호스릴옥내소화전설비는 제외)",
        choices: ["25 mm 이상", "40 mm 이상", "50 mm 이상", "65 mm 이상"],
        answerIndex: 1,
        explain: "정답: 40 mm 이상 (호스릴옥내소화전설비의 호스는 25 mm 이상입니다.) NFTC 102 2.4.2.3"
      },
      {
        id: 5,
        ref: "NFTC 102 · 방수구 높이",
        type: "blank",
        prompt: "옥내소화전 방수구는 바닥으로부터의 높이가 (   ) m 이하가 되도록 설치해야 한다. (숫자만 입력)",
        answers: ["1.5"],
        explain: "정답: 1.5 m 이하 NFTC 102 2.4.2.2"
      },
      {
        id: 6,
        ref: "NFTC 102 · 옥상수조",
        type: "choice",
        prompt: "옥내소화전설비 수원은 계산된 유효수량 외에, 유효수량의 얼마 이상을 옥상에 설치해야 하는가? (설치 제외 대상은 제외)",
        choices: ["4분의 1 이상", "3분의 1 이상", "2분의 1 이상", "전량"],
        answerIndex: 1,
        explain: "정답: 유효수량의 3분의 1 이상 (지하층만 있는 건축물, 건물 높이 10 m 이하, 가압수조 방식 등은 제외됩니다.) NFTC 102 2.1.2"
      },
      {
        id: 7,
        ref: "NFTC 102 · 비상전원",
        type: "choice",
        prompt: "일반 건축물 옥내소화전설비의 비상전원은 해당 설비를 유효하게 몇 분 이상 작동할 수 있는 용량이어야 하는가?",
        choices: ["10분 이상", "20분 이상", "30분 이상", "60분 이상"],
        answerIndex: 1,
        explain: "정답: 20분 이상 (고층건축물은 40분, 50층 이상은 60분입니다.) NFTC 102 2.5.3.2 / NFTC 604 2.1.7"
      },
      {
        id: 8,
        ref: "NFTC 103 · 가지배관 헤드 수",
        type: "blank",
        prompt: "스프링클러설비에서 교차배관에서 분기되는 지점을 기점으로 한쪽 가지배관에 설치되는 헤드의 개수는 (   )개 이하로 해야 한다. (숫자만 입력)",
        answers: ["8"],
        explain: "정답: 8개 이하 (격자형배관방식 채택 등 일부 예외가 있습니다.) NFTC 103 2.5.9.2"
      },
      {
        id: 9,
        ref: "NFTC 103 · 측벽형헤드",
        type: "blank",
        prompt: "측벽형스프링클러헤드를 설치하는 경우에는 긴 변의 한쪽 벽에 일렬로 설치하고 (   ) m 이내마다 설치해야 한다. (숫자만 입력)",
        answers: ["3.6"],
        explain: "정답: 3.6 m 이내 (폭 4.5 m 이상 9 m 이하인 실은 긴 변 양쪽에 각각 일렬로 설치합니다.) NFTC 103 2.7.7.4"
      },
      {
        id: 10,
        ref: "NFTC 103 · 조기반응형헤드",
        type: "choice",
        prompt: "다음 중 조기반응형 스프링클러헤드를 반드시 설치해야 하는 장소로 옳지 않은 것은?",
        choices: ["공동주택·노유자시설의 거실", "오피스텔·숙박시설의 침실", "병원·의원의 입원실", "일반 사무실의 사무공간"],
        answerIndex: 3,
        explain: "정답: 일반 사무실의 사무공간 (조기반응형헤드는 공동주택·노유자시설 거실, 오피스텔·숙박시설 침실, 병원·의원 입원실, 전기차 충전구역에 설치합니다.) NFTC 103 2.7.5"
      },
      {
        id: 11,
        ref: "NFTC 103A · 방수량",
        type: "blank",
        prompt: "간이스프링클러설비는 가장 먼 가지배관에서 2개의 간이헤드를 동시에 개방할 경우 각 헤드의 방수압력 0.1 MPa 이상, 방수량 (   ) L/min 이상이 되어야 한다. (숫자만 입력)",
        answers: ["50"],
        explain: "정답: 50 L/min 이상 (주차장에 표준반응형 스프링클러헤드를 설치하는 경우는 80 L/min 이상입니다.) NFTC 103A 2.2.1"
      },
      {
        id: 12,
        ref: "NFTC 103A · 방호구역",
        type: "choice",
        prompt: "간이스프링클러설비에서 하나의 방호구역 면적 기준은?",
        choices: ["500 ㎡ 이하", "1,000 ㎡ 이하", "3,000 ㎡ 이하", "3,700 ㎡ 이하"],
        answerIndex: 1,
        explain: "정답: 1,000 ㎡ 이하 (방호구역은 2개 층에 걸치지 않도록 하며, 한 층 헤드가 10개 이하면 3개 층 이내로 할 수 있습니다.) NFTC 103A 2.3.1"
      },
      {
        id: 13,
        ref: "NFTC 103A · 간이헤드 수평거리",
        type: "blank",
        prompt: "간이스프링클러헤드는 폐쇄형으로 설치하고, 천장·반자 등의 각 부분으로부터 하나의 간이헤드까지의 수평거리는 (   ) m 이하가 되도록 해야 한다. (숫자만 입력)",
        answers: ["2.3"],
        explain: "정답: 2.3 m 이하 NFTC 103A 2.6.1.3"

        prompt: "연결송수관설비의 방수구는 계단으로부터 보행거리 (   ) m 이내에 설치해야 한다. (숫자만 입력)",
        answers: ["5"],
        explain: "정답: 5 m 이내 (방수구는 그 층의 각 부분까지 수평거리 50 m, 지하 3,000 ㎡ 이상은 25 m 이하이고 높이 0.5~1 m입니다.) NFTC 502 2.3.1.2"
      },
      {
        id: 45,
        ref: "NFTC 502 · 방수기구함",
        type: "blank",
        prompt: "연결송수관설비의 방수기구함은 피난층과 가장 가까운 층부터 (   )개 층마다 설치해야 한다. (숫자만 입력)",
        answers: ["3"],
        explain: "정답: 3개 층마다 (방수구에서 보행거리 5 m 이내에 두고 15 m 호스와 방사형 관창을 비치합니다.) NFTC 502 2.4.1"
      },
      {
        id: 46,
        ref: "NFTC 503 · 연결살수 송수구",
        type: "choice",
        prompt: "연결살수설비 송수구의 설치 기준으로 옳은 것은?",
        choices: [
          "구경 50 mm의 쌍구형, 살수헤드 10개 이하면 단구형 가능",
          "구경 65 mm의 쌍구형, 살수헤드 10개 이하면 단구형 가능",
          "구경 65 mm의 쌍구형, 살수헤드 20개 이하면 단구형 가능",
          "구경 100 mm의 쌍구형만 가능"
        ],
        answerIndex: 1,
        explain: "정답: 65 mm 쌍구형 (하나의 송수구역에 부착하는 살수헤드가 10개 이하인 것은 단구형으로 할 수 있습니다.) NFTC 503 2.1.1.3"
      },
      {
        id: 47,
        ref: "NFTC 504 · 전원회로",
        type: "blank",
        prompt: "비상콘센트설비의 전원회로는 단상교류 220 V, 공급용량 (   ) kVA 이상으로 하고 각 층에 2회로 이상 설치해야 한다. (숫자만 입력)",
        answers: ["1.5"],
        explain: "정답: 1.5 kVA 이상 (하나의 전용회로에 설치하는 비상콘센트는 10개 이하입니다.) NFTC 504 2.1.2"
      },
      {
        id: 48,
        ref: "NFTC 504 · 절연저항",
        type: "choice",
        prompt: "비상콘센트설비의 전원부와 외함 사이의 절연저항 기준은? (500 V 절연저항계로 측정)",
        choices: ["1 ㏁ 이상", "5 ㏁ 이상", "20 ㏁ 이상", "50 ㏁ 이상"],
        answerIndex: 2,
        explain: "정답: 20 ㏁ 이상 NFTC 504 2.1.6"
      },
      {
        id: 49,
        ref: "NFTC 505 · 누설동축케이블",
        type: "blank",
        prompt: "무선통신보조설비의 누설동축케이블 및 동축케이블은 화재로 피복이 소실되어도 케이블이 떨어지지 않도록 (   ) m 이내마다 지지금구로 고정해야 한다. (숫자만 입력)",
        answers: ["4"],
        explain: "정답: 4 m 이내 (임피던스는 50 Ω, 고압 전로로부터는 1.5 m 이상 떨어뜨려 설치합니다.) NFTC 505 2.2.1.4"
      },
      {
        id: 50,
        ref: "NFTC 505 · 증폭기 비상전원",
        type: "blank",
        prompt: "무선통신보조설비의 증폭기에는 몇 분 이상 작동할 수 있는 비상전원을 설치해야 하는가? (숫자만 입력)",
        answers: ["30"],
        explain: "정답: 30분 이상 NFTC 505 2.5.1.3"
      }
    ];

    let remaining = TOTAL_SECONDS;
    let timerId = null;
    let submitted = false;
    let solvedKeysInReview = new Set();

    const timerEl = document.getElementById("timer");
    const introSection = document.getElementById("introSection");
    const quizSection = document.getElementById("quizSection");
    const questionsWrap = document.getElementById("questionsWrap");
    const resultBox = document.getElementById("resultBox");

    function loadJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveJson(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch {}
    }

    function getHistory() {
      const now = Date.now();
      const list = loadJson(HISTORY_KEY, []).filter(item => (now - (item.ts || 0)) <= THIRTY_DAYS_MS);
      saveJson(HISTORY_KEY, list);
      return list;
    }

    function addHistory(score, total, spentSec) {
      const list = getHistory().filter(item => item.round !== QUIZ_DATE);
      list.unshift({
        round: QUIZ_DATE,
        score,
        total,
        spentSec,
        ts: Date.now()
      });
      saveJson(HISTORY_KEY, list);
    }

    function getWrongBank() {
      return loadJson(WRONG_KEY, []);
    }

    function saveWrongBank(list) {
      saveJson(WRONG_KEY, list);
      updateWrongBadge();
    }

    function updateWrongBadge() {
      document.getElementById("wrongCountBadge").textContent = getWrongBank().length;
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function switchTab(tab) {
      document.getElementById("viewToday").classList.toggle("hidden", tab !== "today");
      document.getElementById("viewReview").classList.toggle("hidden", tab !== "review");
      document.getElementById("viewHistory").classList.toggle("hidden", tab !== "history");
      document.getElementById("tabToday").classList.toggle("active", tab === "today");
      document.getElementById("tabReview").classList.toggle("active", tab === "review");
      document.getElementById("tabHistory").classList.toggle("active", tab === "history");
      if (tab === "review") renderReview();
      if (tab === "history") renderHistoryFull();
    }

    function renderQuestions() {
      questionsWrap.innerHTML = "";
      QUESTIONS.forEach((q, idx) => {
        const card = document.createElement("div");
        card.className = "card";
        card.id = `q-card-${q.id}`;

        let inputHtml = "";
        if (q.type === "blank") {
          inputHtml = `<input type="text" class="blank-input" id="ans-${q.id}" placeholder="정답 입력" autocomplete="off" />`;
        } else {
          inputHtml = `<div class="options">` + q.choices.map((c, ci) => `
            <label class="opt-label" data-q="${q.id}">
              <input type="radio" name="ans-${q.id}" value="${ci}" />
              <span>${c}</span>
            </label>
          `).join("") + `</div>`;
        }

        card.innerHTML = `
          <div class="q-head">
            <span class="q-num">Q${idx + 1}.</span>
            <span class="q-ref">${q.ref}</span>
          </div>
          <p class="q-text">${q.prompt}</p>
          ${inputHtml}
          <div class="explain" id="exp-${q.id}">${q.explain}</div>
        `;
        questionsWrap.appendChild(card);
      });

      document.querySelectorAll("#questionsWrap .opt-label input").forEach(inp => {
        inp.addEventListener("change", (e) => {
          const name = e.target.name;
          document.querySelectorAll(`#questionsWrap input[name="${name}"]`).forEach(el => {
            el.closest(".opt-label").classList.toggle("selected", el.checked);
          });
        });
      });
    }

    function startTimer() {
      clearInterval(timerId);
      remaining = TOTAL_SECONDS;
      timerEl.textContent = formatTime(remaining);
      timerEl.className = "timer";
      timerId = setInterval(() => {
        remaining--;
        timerEl.textContent = formatTime(Math.max(0, remaining));
        if (remaining <= 180 && remaining > 60) timerEl.className = "timer warn";
        if (remaining <= 60) timerEl.className = "timer danger";
        if (remaining <= 0) {
          clearInterval(timerId);
          gradeQuiz(true);
        }
      }, 1000);
    }

    function normalize(str) {
      return String(str || "").trim().toLowerCase().replace(/\s+/g, "");
    }

    function renderMonthlySummaryHtml() {
      const list = getHistory();
      if (!list.length) {
        return `<div class="empty-state">아직 저장된 한 달 점수 기록이 없어요.</div>`;
      }
      const avgPct = Math.round(
        list.reduce((acc, it) => acc + (it.total ? (it.score / it.total) * 100 : 0), 0) / list.length
      );
      const rows = list.map(it => {
        const sm = Math.floor((it.spentSec || 0) / 60);
        const ss = (it.spentSec || 0) % 60;
        return `
          <div class="history-item">
            <div>
              <div style="font-weight:700;">${it.round}</div>
              <div style="font-size:11px; color:var(--muted);">소요 ${sm}분 ${ss}초</div>
            </div>
            <div class="history-score">${it.score} / ${it.total}점</div>
          </div>
        `;
      }).join("");

      return `
        <div class="history-title">
          <span>📅 최근 한 달 점수 기록</span>
          <span class="history-stats">총 ${list.length}회 · 평균 ${avgPct}%</span>
        </div>
        <div class="history-list">${rows}</div>
      `;
    }

    function renderHistoryFull() {
      document.getElementById("historyFullCard").innerHTML = renderMonthlySummaryHtml();
    }

    function gradeQuiz(isTimeout = false) {
      if (submitted) return;
      submitted = true;
      clearInterval(timerId);

      let score = 0;
      const bankMap = new Map(getWrongBank().map(item => [item.key, item]));
      let wrongTodayCount = 0;

      QUESTIONS.forEach(q => {
        const card = document.getElementById(`q-card-${q.id}`);
        const exp = document.getElementById(`exp-${q.id}`);
        let ok = false;
        let userAnswerText = "(미입력)";

        if (q.type === "blank") {
          const rawVal = document.getElementById(`ans-${q.id}`).value;
          if (rawVal.trim()) userAnswerText = rawVal.trim();
          ok = q.answers.some(a => normalize(a) === normalize(rawVal));
          document.getElementById(`ans-${q.id}`).disabled = true;
        } else {
          const checked = document.querySelector(`#questionsWrap input[name="ans-${q.id}"]:checked`);
          if (checked) userAnswerText = q.choices[Number(checked.value)];
          ok = checked && Number(checked.value) === q.answerIndex;
          document.querySelectorAll(`#questionsWrap input[name="ans-${q.id}"]`).forEach(el => el.disabled = true);
        }

        const key = `${QUIZ_DATE}::${q.id}`;
        if (ok) {
          score++;
        } else {
          wrongTodayCount++;
          bankMap.set(key, {
            key,
            round: QUIZ_DATE,
            id: q.id,
            ref: q.ref,
            type: q.type,
            prompt: q.prompt,
            choices: q.choices || null,
            answerIndex: q.answerIndex ?? null,
            answers: q.answers || null,
            explain: q.explain,
            userAnswerText
          });
        }

        card.classList.add(ok ? "correct" : "wrong");
        exp.classList.add("show");
      });

      saveWrongBank(Array.from(bankMap.values()));

      const spent = TOTAL_SECONDS - Math.max(0, remaining);
      const sm = Math.floor(spent / 60);
      const ss = spent % 60;
      addHistory(score, QUESTIONS.length, spent);

      document.getElementById("resultTitle").textContent = isTimeout ? "⏰ 시간 종료 · 자동 채점" : "✅ 채점 완료";
      document.getElementById("scoreText").textContent = `${score} / ${QUESTIONS.length}점`;
      document.getElementById("timeSpentText").textContent = `소요 시간: ${sm}분 ${ss}초`;
      document.getElementById("wrongSavedNote").textContent =
        wrongTodayCount > 0
          ? `📌 틀린 ${wrongTodayCount}문제는 [틀린 문제] 탭에 자동 저장되었어요.`
          : "🎉 만점이에요! 오늘 틀린 문제가 없습니다.";
      document.getElementById("resultHistoryWrap").innerHTML = renderMonthlySummaryHtml();

      resultBox.classList.add("show");
      document.getElementById("submitBtn").classList.add("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderReview() {
      const wrap = document.getElementById("reviewWrap");
      const list = getWrongBank();
      solvedKeysInReview = new Set();

      if (!list.length) {
        wrap.innerHTML = `<div class="card empty-state">저장된 틀린 문제가 없어요!<br/>시험에서 틀린 문제가 생기면 여기에 자동으로 쌓입니다.</div>`;
        return;
      }

      wrap.innerHTML = list.map((q, idx) => {
        const safeKey = encodeURIComponent(q.key);
        let inputHtml = "";
        if (q.type === "blank") {
          inputHtml = `<input type="text" class="blank-input" id="rev-ans-${idx}" placeholder="정답 다시 입력" autocomplete="off" />`;
        } else {
          inputHtml = `<div class="options">` + q.choices.map((c, ci) => `
            <label class="opt-label">
              <input type="radio" name="rev-ans-${idx}" value="${ci}" />
              <span>${c}</span>
            </label>
          `).join("") + `</div>`;
        }

        return `
          <div class="card" id="rev-card-${idx}" data-key="${safeKey}">
            <div class="q-head">
              <span class="q-num">오답 ${idx + 1}. (${q.round})</span>
              <div style="display:flex; gap:6px; align-items:center;">
                <span class="q-ref">${q.ref}</span>
                <button class="btn btn-outline btn-sm" onclick="removeWrongItem('${safeKey}')">삭제</button>
              </div>
            </div>
            <div class="prev-wrong">이전 입력: ${q.userAnswerText || "(미입력)"}</div>
            <p class="q-text">${q.prompt}</p>
            ${inputHtml}
            <div class="explain" id="rev-exp-${idx}">${q.explain}</div>
          </div>
        `;
      }).join("");

      wrap.querySelectorAll(".opt-label input").forEach(inp => {
        inp.addEventListener("change", (e) => {
          const name = e.target.name;
          wrap.querySelectorAll(`input[name="${name}"]`).forEach(el => {
            el.closest(".opt-label").classList.toggle("selected", el.checked);
          });
        });
      });
    }

    function gradeReview() {
      const list = getWrongBank();
      if (!list.length) return;
      solvedKeysInReview = new Set();

      list.forEach((q, idx) => {
        const card = document.getElementById(`rev-card-${idx}`);
        const exp = document.getElementById(`rev-exp-${idx}`);
        let ok = false;

        if (q.type === "blank") {
          const rawVal = document.getElementById(`rev-ans-${idx}`).value;
          ok = (q.answers || []).some(a => normalize(a) === normalize(rawVal));
        } else {
          const checked = document.querySelector(`#reviewWrap input[name="rev-ans-${idx}"]:checked`);
          ok = checked && Number(checked.value) === q.answerIndex;
        }

        card.classList.remove("correct", "wrong");
        card.classList.add(ok ? "correct" : "wrong");
        exp.classList.add("show");
        if (ok) solvedKeysInReview.add(q.key);
      });
    }

    function removeWrongItem(encodedKey) {
      const key = decodeURIComponent(encodedKey);
      const next = getWrongBank().filter(item => item.key !== key);
      saveWrongBank(next);
      renderReview();
    }

    function clearSolvedReview() {
      if (!solvedKeysInReview.size) {
        alert("먼저 [복습 채점하기]를 눌러 맞힌 문제를 확인해 주세요!");
        return;
      }
      const next = getWrongBank().filter(item => !solvedKeysInReview.has(item.key));
      saveWrongBank(next);
      renderReview();
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      submitted = false;
      renderQuestions();
      introSection.classList.add("hidden");
      resultBox.classList.remove("show");
      quizSection.classList.remove("hidden");
      document.getElementById("submitBtn").classList.remove("hidden");
      startTimer();
    });

    document.getElementById("submitBtn").addEventListener("click", () => gradeQuiz(false));

    document.getElementById("retryBtn").addEventListener("click", () => {
      submitted = false;
      renderQuestions();
      resultBox.classList.remove("show");
      document.getElementById("submitBtn").classList.remove("hidden");
      startTimer();
    });

    document.getElementById("copyBtn").addEventListener("click", async () => {
      const score = document.getElementById("scoreText").textContent;
      const spent = document.getElementById("timeSpentText").textContent;
      const text = `🚒 소방기술사 50문제·10분 샘플 (${QUIZ_DATE})\n결과: ${score} (${spent})`;
      try {
        await navigator.clipboard.writeText(text);
        document.getElementById("copyBtn").textContent = "✅ 복사 완료!";
        setTimeout(() => { document.getElementById("copyBtn").textContent = "📋 결과 복사해서 인증하기"; }, 2000);
      } catch {
        alert(text);
      }
    });

    updateWrongBadge();
  </script>
</body>
</html>
